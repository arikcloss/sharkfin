# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: sharkfin-macintosh-bazzite
# description will be included in the image's metadata
description: Bazzite (GNOME) tuned for Apple Intel Macs (2012-2018) with the FaceTime webcam and Broadcom wireless support baked in. This bootable container image follows Bazzite's stable-weekly image channel.
alt-tags:
  - stable
  - stable-weekly

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/bazzite-dx-gnome
image-version: stable

# module configuration, executed in order
modules:
  - from-file: features/system-files.yml
  - from-file: features/application-rpms.yml
  - from-file: features/google-chrome.yml
  - from-file: features/cockpit.yml
  - from-file: features/fonts.yml
  - from-file: features/gnome-ui-fixes.yml
  - from-file: features/wallpapers.yml
  - from-file: features/flatpaks.yml
  - type: files
    files:
    - source: dconf-bluefin
      destination: /etc/dconf/db/distro.d
  - type: gnome-extensions
    install:
      - Dash to Dock
  - from-file: features/sharkfin-macintosh-common.yml
  - type: akmods
    base: ogc  # Bazzite now ships the OGC kernel; ublue builds wl for it
    install:
      - wl
  - type: script
    snippets: []
    scripts:
      - sharkfin-disable-steam-autostart.sh