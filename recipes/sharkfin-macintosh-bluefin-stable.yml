# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: sharkfin-macintosh-bluefin
# description will be included in the image's metadata
description: Bluefin DX tuned for Apple Intel Macs (2012-2018) with the FaceTime webcam and Broadcom wireless support baked in. This bootable container image follows Bluefin's stable-weekly image channel.
alt-tags:
  - stable
  - stable-weekly

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/bluefin-dx
image-version: stable

# module configuration, executed in order
modules:
  - from-file: features/sharkfin-bluefin-features.yml
  - from-file: features/sharkfin-macintosh-common.yml
  - type: akmods
    install:
      - wl
  - type: gschema-overrides  # Override Bluefin's overrides of Gnome default fonts
    include:
      - zz42-sharkfin-bluefin.gschema.override