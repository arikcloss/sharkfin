# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: sharkfin-macintosh
# description will be included in the image's metadata
description: A Fedora Silverblue image tuned for Apple Intel Macs (2012-2018) with the FaceTime webcam and Broadcom wireless support baked in.
alt-tags:
  - latest

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/silverblue-main
image-version: latest # current Fedora stream (F44)

# module configuration, executed in order
modules:
  - from-file: features/sharkfin-features.yml
  - type: dnf
    repos:
      nonfree: rpmfusion
    install:
      packages:
        - akmod-wl
        - broadcom-wl
  - from-file: features/sharkfin-macintosh-common.yml
  - type: script
    env:
      SHARKFIN_WALLPAPER: blendpills-l.jxl
    scripts:
      - set-default-wallpaper.sh
