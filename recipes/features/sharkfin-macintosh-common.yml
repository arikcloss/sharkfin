# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json

# Hardware enablement for Apple Intel Macs (MacBook/MacBook Air/MacBook Pro,
# 2012-2018, non-T1/T2):
#   - FaceTime HD camera (Broadcom/PCIe 1570 webcam on 2015+ models) via the
#     facetimehd driver + firmware from the mulderje/facetimehd-kmod COPR
#   - Broadcom Bluetooth firmware (BCM20702/20703) — lives in RPM Fusion
#     nonfree/tainted, so it is intentionally NOT pulled in here; linux-firmware
#     covers the common MacBook Air/Pro WiFi and most BRCM BT
#   - helper/power packages (powertop) and Intel VA-API media drivers
#
# Broadcom Wi-Fi: the macintosh image pulls the proprietary broadcom-wl driver
# from RPM Fusion nonfree (akmod-wl + broadcom-wl, enabled in the recipe) --
# built for a kernel in the image, so it avoids the ublue prebuilt kmod race on
# every Fedora release. wl ships its own blacklist file, so no modprobe tweaks
# are needed here (the install script only blacklists the legacy b43/bcma/ssb).
modules:
  - type: dnf
    repos:
      copr:
        - mulderje/facetimehd-kmod
    install:
      packages:
        - facetimehd-kmod
        - facetimehd-firmware
        - powertop
        # Fedora name for the Intel VA-API driver (the old intel-media-driver
        # name only exists in RPM Fusion nonfree since F40).
        - libva-intel-media-driver

  - type: script
    scripts:
      - install-macintosh-tweaks.sh