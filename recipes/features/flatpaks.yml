# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json

# Flatpaks are baked straight into the image's read-only /usr (an "image"
# flatpak installation at /usr/share/flatpaks) at build time, so they're
# already installed on the live ISO / first boot / after install -- no runtime
# install service. The default-flatpaks module was dropped because it installs
# on every boot instead of embedding; the first attempt (flatpak install
# --system, which writes to /var/lib/flatpak) was wrong because bootc discards
# /var as machine-local state.
modules:
  - type: script
    scripts:
      - bake-flatpaks.sh