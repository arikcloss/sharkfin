# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json

# Flatpaks are baked straight into the image (system scope) at build time, so
# they're already installed on first boot / on the live ISO -- no runtime
# install service. The default-flatpaks module was dropped because it installs
# on every boot instead of embedding.
modules:
  - type: script
    scripts:
      - bake-flatpaks.sh