# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: sharkfin-bluefin
# description will be included in the image's metadata
description: Bluefin DX with my personal preferences baked in. This bootable container image follows Bluefin's gts image channel on Fedora 43 (current minus one).
alt-tags:
  - gts

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/bluefin-dx
image-version: gts # Bluefin doesn't publish a numeric 43 tag; its gts stream is the previous Fedora (43)

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - from-file: features/sharkfin-bluefin-features.yml
  - type: gschema-overrides  # Override Bluefin's overrides of Gnome default fonts
    include:
      - zz42-sharkfin-bluefin.gschema.override
  - type: script
    env:
      SHARKFIN_WALLPAPER: System76-Fractal_Mountains-by_Kate_Hazen_of_System76.png
    scripts:
      - set-default-wallpaper.sh