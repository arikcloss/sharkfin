# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: sharkfin
# description will be included in the image's metadata
description: A Fedora Silverblue Bootable Container image with my personal preferences and Universal Blue improvements baked in
alt-tags:
  - gts

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/silverblue-main
image-version: 43

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - from-file: features/sharkfin-features.yml
  - type: script
    env:
      SHARKFIN_WALLPAPER: System76-Geometric-adapted_by_Kate_Hazen_of_System76.png
    scripts:
      - set-default-wallpaper.sh